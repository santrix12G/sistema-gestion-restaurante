# Blueprint de Render: despliega la API (apps/api). Ver docs/despliegue.md
services:
  - type: web
    name: restaurante-api
    runtime: node
    plan: free
    # Cerca de Supabase (ca-central-1)
    region: virginia
    rootDir: apps/api
    # Las migraciones se aplican antes de compilar; en el plan gratis no hay paso previo al despliegue
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase > Connect > Session pooler (puerto 5432)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # La dirección de la web en Vercel, por ejemplo https://restaurante.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # WhatsApp directo con Meta. Webhook: https://TU-API/api/webhooks/whatsapp
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_VERIFY_TOKEN
        value: sistema-gestion-restaurante
      - key: META_PHONE_NUMBER_ID
        value: "1352447814628542"
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      # reglas, groq, claude u openai. Con groq (gratis), pon GROQ_API_KEY; con claude, ANTHROPIC_API_KEY;
      # con openai, OPENAI_API_KEY y OPENAI_MODEL
      - key: NLP_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: COSTO_DOMICILIO
        value: "5000"
      # Pago en línea con MercadoPago. Webhook: https://TU-API/api/webhooks/mercadopago. Ver docs/pagos.md
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
